<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/ico" href="img/Letter_A_lg_35059.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Serif+Georgian:wght@100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
    rel="stylesheet">
  <link href="css/normalize.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <title>Alivio</title>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <section class="header">
      <div class="header__top">
        <img class="header__top__logo" src="img/Logo.svg" alt="Logo">
        <ul class="header__top__nav">
          <li><a href="#">Why Alivio</a></li>
          <li><a href="#">Solutions</a></li>
          <li><a href="#">Community</a></li>
          <li><a href="#">Pricing</a></li>
        </ul>
        <form class="auth__form">
          <div class="header__action__btn">
            <!-- Sign in -->
            <button class="sign__btn" type="button">Sign in</button>
            <!-- Start Trial -->
            <button class="start__btn" type="submit">Start Trial</button>
          </div>
        </form>
      </div>
      <div class="header__bg">
        <div class="header__bg__headline">
          <h1 class="headline__h1">Be aware,
            Manage well.</h1>
          <p class="headline__p">Everyone experiences stress in different ways.
            Let Alivio guide you, in a personalized journal experience, to overcome your stress.</p>
          <button class="headline__btn" type="submit">Find Your Way</button>
        </div>
      </div>
    </section>
  </div>
</body>

</html>
